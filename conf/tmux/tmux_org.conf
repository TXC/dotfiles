# make tmux display things in 256 colors
set -g default-terminal "screen-256color"

# set scrollback history to 10000 (10k)
set -g history-limit 10000

# set Ctrl-a as the default prefix key combination
# and unbind C-b to free it up
set -g prefix C-a
unbind C-b

# Vi uber emacs
set-window-option -g mode-keys vi

# use send-prefix to pass C-a through to application
bind C-a send-prefix

# use PREFIX | to split window horizontally and PREFIX - to split vertically
bind w split-window -h
bind e split-window -v

set -g status-bg white
set -g status-fg black
set -g status-interval 5
set -g status-left-length 90
set -g status-right-length 60
set -g status-justify left

set-option -g status-left "#[fg=green,bg=default]#(~/bin/tmux_git_status.sh #{pane_current_path}) | #(ocp-auto-login.sh)"
set -g window-status-current-format "#[bg=blue,fg=white,bold] #I:#W "
set -g window-status-format "#[bg=default,fg=black] #I:#W "

#set -g mouse on
set -g pane-border-style "fg=grey"
set -g pane-active-border-style "fg=blue"


# Send to all
bind m set-window-option synchronize-panes

# use xterm-keys (ctrl+-> for instance)
set-window-option -g xterm-keys on

set-option -g base-index 1

set-option -g pane-border-format " #P: #{pane_current_command} "

